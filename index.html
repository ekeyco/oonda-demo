/* ================= base ================= */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  color-scheme:var(--scheme);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background-color .4s;
}
body::before{content:'';position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:
    radial-gradient(40% 35% at 85% 8%, var(--bg2), transparent 70%),
    radial-gradient(35% 40% at 5% 95%, var(--bg3), transparent 70%);
  opacity:.9}
button{font-family:inherit;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
::selection{background:var(--soft)}
.hide{display:none!important}
.muted{color:var(--muted)}
.hand{font-family:var(--hand);font-weight:600;color:var(--acc);font-size:22px;line-height:1}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.mt8{margin-top:8px}.mt14{margin-top:14px}.mt20{margin-top:20px}

/* ================= floating paper background ================= */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;perspective:1400px;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.bgfx i{position:absolute;display:block;width:var(--w);height:calc(var(--w) * 1.32);border-radius:14px;
  background:
    linear-gradient(90deg, transparent 18%, color-mix(in srgb,var(--acc) 30%,transparent) 18% calc(18% + 1px), transparent calc(18% + 1px)),
    repeating-linear-gradient(transparent 0 17px, var(--line) 17px 18px),
    var(--paper);
  background-position:0 0,0 30px,0 0;
  opacity:var(--o,.5);box-shadow:0 30px 50px -30px rgba(var(--shadow),.35);
  animation:drift var(--d) ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes drift{
  from{transform:translate3d(0,0,0) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz))}
  to{transform:translate3d(var(--tx),var(--ty),60px) rotateX(calc(var(--rx) * -.6)) rotateY(calc(var(--ry) * -1)) rotateZ(calc(var(--rz) + 14deg))}}

/* ================= app layout ================= */
.app{position:relative;z-index:1;display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 16px 18px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--head);font-weight:var(--hw2);font-size:30px;letter-spacing:-.03em}
.brand .ast{font-size:14px;color:var(--acc);vertical-align:super;margin-left:2px}
.logo3d{display:inline-block;animation:bob 5s ease-in-out infinite;transform-style:preserve-3d}
@keyframes bob{0%,100%{transform:perspective(300px) rotateY(-14deg) rotateX(6deg)}50%{transform:perspective(300px) rotateY(14deg) rotateX(-4deg) translateY(-2px)}}
.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;
  background:var(--dark);color:var(--dark-ink);font:800 15px var(--body);padding:13px 16px;border-radius:18px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--dark) 72%,#000),0 14px 24px -14px rgba(var(--shadow),.6);
  transition:transform .12s, box-shadow .12s}
.newbtn:hover{transform:translateY(-1px)}
.newbtn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--dark) 72%,#000)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:16px;border:1px solid transparent;
  background:none;font:700 15px var(--body);cursor:pointer;text-align:left;color:var(--ink);opacity:.78;transition:background .2s,transform .2s,opacity .2s}
.nav button:hover{opacity:1;transform:translateX(3px)}
.nav button.on{opacity:1;background:var(--paper);border-color:var(--line);box-shadow:var(--sh)}
.nav button.on svg{color:var(--acc)}
.nav .cnt{margin-left:auto;font:500 11px var(--mono);background:var(--soft);color:var(--ink);padding:2px 8px;border-radius:99px}
.nav .cnt.hot{background:var(--hi);color:#fff}
.sidefoot{margin-top:auto}
.tipcard{background:var(--paper);border:1px dashed var(--line);border-radius:18px;padding:12px 14px;font-size:13px;color:var(--muted)}
.tipcard .hand{display:block;margin-bottom:4px;font-size:20px}
.kbd{display:inline-block;font:500 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;background:var(--paper2);color:var(--ink)}

main{padding:28px 36px 90px;max-width:1320px;width:100%;min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-family:var(--head);font-weight:var(--hw);font-size:42px;letter-spacing:-.025em;margin:0;line-height:1}
.top .sub{color:var(--muted);font-size:14px;margin-top:4px}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:0 12px;height:44px;min-width:220px;color:var(--muted)}
.search input{border:0;background:none;outline:none;font:600 14px var(--body);width:100%;color:var(--ink)}
.ib{width:44px;height:44px;border-radius:15px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;transition:transform .2s}
.ib:hover{transform:translateY(-2px) rotate(-6deg)}

/* ================= cards / grid ================= */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;align-items:start}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh);
  transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.card h3{font-family:var(--head);font-weight:var(--hw);font-size:19px;letter-spacing:-.01em;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.card h3 .link{margin-left:auto}
.link{border:0;background:none;font:700 13px var(--body);color:var(--acc);cursor:pointer;padding:0}
.link:hover{text-decoration:underline}
[data-tilt]{transform-style:preserve-3d;will-change:transform}
[data-tilt]::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%), var(--shine), transparent 55%)}
[data-tilt]:hover::after{opacity:1}
[data-tilt]:hover{box-shadow:var(--sh2)}
.enter .card,.enter .pfold,.enter .theme-card{animation:deal .75s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes deal{from{opacity:0;transform:perspective(1000px) translateY(30px) rotateX(-20deg) scale(.96)}}

/* ================= buttons / inputs ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  padding:10px 16px;border-radius:14px;font:800 14px var(--body);cursor:pointer;box-shadow:0 2px 0 var(--line);transition:transform .12s,box-shadow .12s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.dark{background:var(--dark);color:var(--dark-ink);border-color:transparent;box-shadow:0 3px 0 color-mix(in srgb,var(--dark) 70%,#000)}
.btn.acc{background:var(--acc);color:var(--acc-ink);border-color:transparent;box-shadow:0 3px 0 color-mix(in srgb,var(--acc) 70%,#000)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.warn{color:var(--hi)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:11px}
.seg{display:inline-flex;background:var(--paper2);border:1px solid var(--line);border-radius:15px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;border-radius:11px;font:800 13px var(--body);color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 6px -2px rgba(var(--shadow),.3)}
.seg button b{font:500 11px var(--mono);margin-left:5px;opacity:.7}
.inp{width:100%;background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font:600 15px var(--body);color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.5}
.lbl{display:block;font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 7px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font:800 12px var(--body);background:var(--c,var(--soft));color:#2b2326;white-space:nowrap;border:0}
button.chip{cursor:pointer;padding:6px 13px;font-size:13px;background:var(--paper);color:var(--ink);border:1px solid var(--line);transition:transform .15s}
button.chip:hover{transform:translateY(-2px)}
button.chip.on{background:var(--dark);color:var(--dark-ink);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:4px;font:500 12px var(--mono);color:var(--muted)}
.pill.over{color:var(--hi)}
.pill.today{color:var(--acc)}

/* ================= task rows ================= */
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--paper2);border:1px solid transparent;cursor:pointer;
  transform-origin:top center;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s,border-color .2s,box-shadow .25s}
.trow:hover{transform:perspective(700px) translateY(-2px) rotateX(5deg);background:var(--paper);border-color:var(--line);box-shadow:0 14px 24px -16px rgba(var(--shadow),.45)}
.trow .tmain{flex:1;min-width:0}
.trow .ttitle{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tmeta{display:flex;align-items:center;gap:10px;margin-top:3px;flex-wrap:wrap}
.trow.done .ttitle{text-decoration:line-through;text-decoration-color:var(--acc);color:var(--muted)}
.trow.done{opacity:.75}
.prio{width:8px;height:8px;border-radius:50%;flex:none}
.p-high{background:var(--hi)}.p-med{background:var(--med)}.p-low{background:var(--lo)}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid color-mix(in srgb,var(--muted) 70%,transparent);background:var(--paper);display:grid;place-items:center;flex:none;cursor:pointer;padding:0;transition:transform .15s,background .2s}
.chk:hover{transform:scale(1.12) rotate(-6deg);border-color:var(--acc)}
.chk svg{opacity:0;color:var(--acc-ink)}
.done .chk,.chk.on{background:var(--acc);border-color:var(--acc)}
.done .chk svg,.chk.on svg{opacity:1}
.fresh{animation:dropin .7s cubic-bezier(.3,1.3,.5,1) both}
@keyframes dropin{from{opacity:0;transform:perspective(700px) translateY(-26px) rotateX(70deg)}}
.stamp{position:absolute;right:16%;top:50%;z-index:3;pointer-events:none;font:800 17px var(--head);letter-spacing:.14em;text-transform:uppercase;
  color:var(--acc);border:3px solid var(--acc);padding:1px 12px;border-radius:10px;background:color-mix(in srgb,var(--paper) 60%,transparent);
  transform:translateY(-50%) rotate(-12deg);animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}
.stamp.big{font-size:30px;padding:4px 20px;border-width:4px;right:10%}
@keyframes stamp{0%{opacity:0;transform:translateY(-50%) scale(3) rotate(-32deg)}55%{opacity:1;transform:translateY(-50%) scale(.9) rotate(-9deg)}100%{opacity:1;transform:translateY(-50%) scale(1) rotate(-12deg)}}
.thud{animation:thud .3s .22s}
@keyframes thud{35%{transform:translateY(3px) scale(.985)}}
.foldaway{animation:foldaway .55s .8s cubic-bezier(.6,0,.4,1) forwards!important}
@keyframes foldaway{to{opacity:0;transform:perspective(800px) rotateX(-92deg) translateY(-8px)}}
.grp{margin-top:18px}
.grp:first-child{margin-top:0}
.grp-h{display:flex;align-items:baseline;gap:10px;margin:0 4px 8px}
.grp-h .hand{font-size:24px}
.grp-h .mono{color:var(--muted)}

/* ================= empty ================= */
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .papers{position:relative;width:90px;height:90px;margin:0 auto 12px;perspective:400px}
.empty .papers i{position:absolute;inset:8px 14px;border-radius:10px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--sh)}
.empty .papers i:nth-child(1){transform:rotate(-12deg) translateX(-8px)}
.empty .papers i:nth-child(2){transform:rotate(8deg) translateX(8px)}
.empty .papers i:nth-child(3){animation:floaty 3s ease-in-out infinite;background:repeating-linear-gradient(transparent 0 11px,var(--line) 11px 12px) 0 14px/100% no-repeat,var(--paper)}
@keyframes floaty{50%{transform:translateY(-6px) rotateX(14deg)}}
.empty b{display:block;color:var(--ink);font-family:var(--head);font-weight:var(--hw);font-size:18px}

/* ================= hero / today ================= */
.hero{display:flex;gap:22px;align-items:center;overflow:hidden}
.hero h2{font-family:var(--head);font-weight:var(--hw);font-size:36px;letter-spacing:-.02em;margin:0;line-height:1.05}
.hero .say{color:var(--muted);margin:8px 0 16px;font-size:15px}
.qa{display:flex;gap:8px}
.qa .inp{background:var(--paper2)}
.ring{position:relative;flex:none;width:132px;height:132px}
.ring svg{transform:rotate(-90deg)}
.ring .arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid b{display:block;font-family:var(--head);font-weight:var(--hw);font-size:30px;line-height:1}
.ring .mid span{font:500 11px var(--mono);color:var(--muted)}
.preview{display:flex;gap:6px;flex-wrap:wrap;min-height:26px;margin-top:8px}

.clocks{display:flex;flex-direction:column;gap:12px}
.clock{display:flex;align-items:center;gap:14px}
.face{position:relative;width:54px;height:54px;border-radius:50%;flex:none;background:var(--paper2);border:1px solid var(--line);
  box-shadow:inset 0 -4px 8px rgba(var(--shadow),.08),0 6px 12px -8px rgba(var(--shadow),.5);transform:perspective(300px) rotateX(14deg)}
.face i{position:absolute;left:50%;bottom:50%;width:3px;border-radius:3px;background:var(--ink);transform-origin:bottom center;transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.face i.h{height:15px;margin-left:-1.5px}
.face i.m{height:21px;width:2px;margin-left:-1px;background:var(--acc)}
.face::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--ink)}
.clock .t{font-family:var(--head);font-weight:var(--hw);font-size:24px;line-height:1}
.clock .l{font:500 11.5px var(--mono);color:var(--muted);margin-top:3px}

.stack{position:relative;perspective:1100px;margin-top:6px}
.stack::before,.stack::after{content:'';position:absolute;inset:0;border-radius:20px;background:var(--paper2);border:1px solid var(--line)}
.stack::before{transform:rotate(-3.5deg) translate(-6px,8px)}
.stack::after{transform:rotate(2.5deg) translate(6px,5px);background:color-mix(in srgb,var(--paper2) 60%,var(--soft))}
.topsheet{position:relative;z-index:2;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px 22px;min-height:180px;
  background-image:linear-gradient(90deg,transparent 30px,color-mix(in srgb,var(--acc) 35%,transparent) 30px 31px,transparent 31px);
  box-shadow:0 18px 30px -20px rgba(var(--shadow),.5)}
.topsheet .tt{font-family:var(--head);font-weight:var(--hw);font-size:26px;line-height:1.1;letter-spacing:-.015em;margin:10px 0 8px;padding-left:22px}
.topsheet .meta,.topsheet .nt{padding-left:22px}
.topsheet .nt{color:var(--muted);font-size:14px;margin-top:6px}
.flyoff{animation:flyoff .55s cubic-bezier(.5,0,.75,0) forwards}
@keyframes flyoff{to{opacity:0;transform:translateX(115%) translateY(-30px) rotateZ(16deg) rotateY(-40deg)}}
.flyin{animation:flyin .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes flyin{from{opacity:0;transform:translateY(14px) scale(.94) rotateX(18deg)}}
.bar-sm{height:7px;border-radius:9px;background:var(--paper2);overflow:hidden;border:1px solid var(--line)}
.bar-sm i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width 1s cubic-bezier(.2,.8,.2,1)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;perspective:700px}
.wd{text-align:center;padding:8px 2px;border-radius:14px;cursor:pointer;transition:transform .25s,background .2s;border:1px solid transparent}
.wd:hover{transform:translateY(-4px) rotateX(12deg);background:var(--paper2)}
.wd.on{background:var(--soft);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.wd .d1{font:500 10.5px var(--mono);color:var(--muted);text-transform:uppercase}
.wd .d2{font-family:var(--head);font-weight:var(--hw);font-size:20px}
.mini{position:relative;height:30px;margin-top:4px}
.mini i{position:absolute;left:50%;width:18px;height:22px;margin-left:-9px;border-radius:4px;background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 4px -2px rgba(var(--shadow),.4)}
.mini i.dn{background:var(--acc);border-color:var(--acc)}
.streak{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.streak b{font-family:var(--head);font-weight:var(--hw);font-size:28px}

.sticky{position:relative;border-radius:6px 6px 22px 6px;padding:22px 18px 16px;transform:rotate(-1.4deg);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s;
  background:color-mix(in srgb,var(--acc2) 32%,var(--paper));border:0;box-shadow:0 22px 30px -22px rgba(var(--shadow),.6)}
.sticky:hover{transform:perspective(800px) rotate(0deg) rotateX(7deg) translateY(-4px);box-shadow:0 30px 40px -24px rgba(var(--shadow),.6)}
.sticky::before,.paper::before{content:'';position:absolute;top:-11px;left:50%;width:110px;height:24px;margin-left:-55px;transform:rotate(-3deg);z-index:4;
  background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--acc) 55%,transparent) 0 6px,color-mix(in srgb,var(--acc) 38%,transparent) 6px 12px);opacity:.85;border-radius:2px}
.sticky textarea{width:100%;min-height:168px;border:0;background:repeating-linear-gradient(transparent 0 29px,color-mix(in srgb,var(--ink) 14%,transparent) 29px 30px);
  font:600 23px/30px var(--hand);color:var(--ink);resize:none;outline:none;padding:0}
.sticky h3{margin-bottom:6px}

.projmini{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pm{padding:12px 14px;border-radius:16px;background:var(--paper2);cursor:pointer;transition:transform .25s}
.pm:hover{transform:perspective(600px) translateY(-3px) rotateX(8deg)}
.pm .row{font-weight:800;margin-bottom:8px}

/* ================= board ================= */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{background:color-mix(in srgb,var(--paper2) 80%,transparent);border:1px solid var(--line);border-radius:24px;padding:12px;min-height:340px;transition:outline-color .2s,background .2s;outline:2px dashed transparent;outline-offset:-6px}
.col.over{outline-color:var(--acc);background:var(--soft)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 12px;font-family:var(--head);font-weight:var(--hw);font-size:18px}
.col-h .mono{margin-left:auto;color:var(--muted)}
.bcard{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:grab;
  box-shadow:0 8px 16px -12px rgba(var(--shadow),.5);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.bcard:hover{transform:perspective(700px) translateY(-3px) rotateX(6deg) rotateZ(-.6deg)}
.bcard.dragging{opacity:.35;transform:rotate(4deg) scale(1.02)}
.bcard .ttitle{font-weight:800;margin:6px 0}
.bcard.done .ttitle{text-decoration:line-through;color:var(--muted)}

/* ================= calendar ================= */
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
.calhead div{font:500 11px var(--mono);text-transform:uppercase;color:var(--muted);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.flipnext{animation:flipnext .6s cubic-bezier(.2,.8,.3,1) both;transform-origin:top center}
.flipprev{animation:flipprev .6s cubic-bezier(.2,.8,.3,1) both;transform-origin:bottom center}
@keyframes flipnext{from{opacity:0;transform:perspective(1300px) rotateX(-75deg)}}
@keyframes flipprev{from{opacity:0;transform:perspective(1300px) rotateX(75deg)}}
.cday{min-height:98px;background:var(--paper2);border:1px solid transparent;border-radius:16px;padding:7px 8px;cursor:pointer;transition:transform .2s,background .2s;overflow:hidden}
.cday:hover{transform:translateY(-2px);background:var(--paper);border-color:var(--line)}
.cday.out{opacity:.42}
.cday.today{border-color:var(--acc)}
.cday.today .n{background:var(--acc);color:var(--acc-ink)}
.cday.sel{background:var(--paper);box-shadow:var(--sh2);border-color:var(--line)}
.cday .n{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:9px;font:800 13px var(--body);margin-bottom:4px}
.cday .ci{display:block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:7px;margin-top:3px;background:var(--c,var(--soft));color:#2b2326;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cday .ci.dn{text-decoration:line-through;opacity:.6}
.cday .more{font:500 10.5px var(--mono);color:var(--muted);margin-top:3px;display:block}

/* ================= project folders ================= */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px 22px}
.pfold{position:relative;height:220px;cursor:pointer;perspective:900px}
.pfold .pb{position:absolute;inset:22px 0 0;border-radius:6px 20px 20px 20px;background:color-mix(in srgb,var(--c) 78%,#000 14%)}
.pfold .pb::before{content:'';position:absolute;left:0;top:-20px;width:42%;height:26px;border-radius:14px 14px 0 0;background:inherit}
.pfold .pp{position:absolute;left:9%;right:9%;top:34px;height:150px;border-radius:10px;background:var(--paper);box-shadow:0 -4px 12px -6px rgba(0,0,0,.25);
  padding:12px 12px;font-size:11.5px;font-weight:700;color:var(--ink);transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.pfold .pp:nth-of-type(2){left:13%;right:5%;top:42px;transform:rotate(3deg)}
.pfold .pp div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px 0;border-bottom:1px solid var(--line)}
.pfold .pf{position:absolute;left:0;right:0;bottom:0;height:68%;border-radius:18px;background:linear-gradient(175deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));
  color:#2b2326;transform-origin:bottom center;transition:transform .55s cubic-bezier(.3,1.35,.5,1),box-shadow .5s;padding:16px 18px;display:flex;flex-direction:column;justify-content:flex-end;
  box-shadow:0 -8px 18px -12px rgba(0,0,0,.35),0 20px 30px -24px rgba(var(--shadow),.7)}
.pfold:hover .pf{transform:rotateX(-28deg);box-shadow:0 -2px 10px -6px rgba(0,0,0,.3),0 30px 40px -20px rgba(var(--shadow),.6)}
.pfold:hover .pp{transform:translateY(-30px)}
.pfold:hover .pp:nth-of-type(2){transform:translateY(-16px) rotate(5deg)}
.pf .em{font-size:26px;line-height:1}
.pf .nm{font-family:var(--head);font-weight:var(--hw);font-size:21px;margin:6px 0 8px;letter-spacing:-.01em}
.pf .bar-sm{background:rgba(255,255,255,.55);border-color:transparent}
.pf .bar-sm i{background:#2b2326}
.pf .mono{opacity:.75;margin-top:6px}
.pf .ed{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:10px;border:0;background:rgba(255,255,255,.6);cursor:pointer;display:grid;place-items:center;color:#2b2326}
.pfold.add .pf{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--muted);align-items:center;justify-content:center;text-align:center}
.pfold.add .pb,.pfold.add .pp{display:none}
.pfold.add:hover .pf{transform:translateY(-4px)}

/* ================= review ================= */
.stat{padding:18px 20px}
.stat .k{font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat .v{font-family:var(--head);font-weight:var(--hw);font-size:40px;line-height:1.05;margin-top:6px;letter-spacing:-.02em}
.stat .s{font-size:13px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .b i{display:block;width:100%;max-width:46px;border-radius:10px 10px 5px 5px;height:var(--h);min-height:3px;transform-origin:bottom;
  background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 75%,#fff),var(--acc));box-shadow:inset -6px 0 0 rgba(0,0,0,.07),0 6px 10px -6px rgba(var(--shadow),.6);
  animation:grow .9s cubic-bezier(.2,.9,.3,1.15) backwards;animation-delay:calc(var(--i) * 40ms)}
.bars .b i.z{background:var(--line);box-shadow:none}
.bars .b span{font:500 10px var(--mono);color:var(--muted)}
@keyframes grow{from{transform:scaleY(0)}}
.hbar{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;margin-bottom:10px;font-weight:800;font-size:14px}
.hbar .tr{height:14px;border-radius:9px;background:var(--paper2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:9px;background:var(--c);animation:growx 1s cubic-bezier(.2,.9,.3,1) backwards;transform-origin:left}
@keyframes growx{from{transform:scaleX(0)}}

/* ================= settings ================= */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.theme-card{position:relative;border-radius:20px;padding:14px;cursor:pointer;border:2px solid transparent;background:var(--tbg);color:var(--tink);
  transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;box-shadow:0 10px 20px -14px rgba(0,0,0,.4)}
.theme-card.on{border-color:var(--acc)}
.theme-card .tp{background:var(--tpaper);border-radius:12px;padding:10px;height:82px;position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(transparent 0 13px,var(--tline) 13px 14px);background-position:0 26px}
.theme-card .tp b{font-family:var(--thead);font-weight:var(--thw);font-size:20px;color:var(--tink)}
.theme-card .tr{display:flex;align-items:center;gap:6px;margin-top:9px;background:var(--tp2);border-radius:7px;padding:5px 6px}
.theme-card .tr i{width:11px;height:11px;border-radius:4px;background:var(--tacc);flex:none}
.theme-card .tr s{height:5px;border-radius:3px;background:var(--tline);flex:1;text-decoration:none}
.theme-card .tr s+s{flex:.5;background:var(--tacc2);opacity:.7}
.theme-card .sw{display:flex;gap:5px;margin-top:10px}
.theme-card .sw i{width:20px;height:20px;border-radius:50%;border:2px solid var(--tpaper)}
.theme-card .nm{font-weight:800;margin-top:10px;font-size:14px}
.theme-card .bl{font-size:12px;opacity:.65}
.theme-card .ok{z-index:2;position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .tx{flex:1}
.setrow .tx b{display:block}
.setrow .tx span{font-size:13px;color:var(--muted)}
.tog{width:50px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;transition:background .25s;flex:none}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--paper);box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.tog.on{background:var(--acc)}
.tog.on::after{transform:translateX(20px)}
.kbds{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;align-items:center}

/* ================= the sheet (folder → paper) ================= */
.sheet-layer{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:5vh 16px 4vh;overflow:hidden}
.scrim{position:absolute;inset:0;background:rgba(var(--shadow),.34);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .35s both}
@keyframes fade{from{opacity:0}}
.stage{position:relative;width:min(var(--sw,560px),100%)}
.paper{position:relative;z-index:2;animation:paperOut 1.2s cubic-bezier(.22,.75,.25,1) both}
.paper::before{top:-12px}
.paper-in{position:relative;background:var(--paper);border-radius:22px;box-shadow:0 40px 80px -30px rgba(var(--shadow),.55),0 8px 20px -10px rgba(var(--shadow),.25);
  max-height:88vh;overflow:auto;padding:28px 30px 24px;animation:unclip 1.08s step-end both}
@keyframes unclip{0%{clip-path:inset(0 0 34% 0 round 22px)}100%{clip-path:none}}
.flap{position:absolute;left:0;right:0;top:66%;height:34%;z-index:3;pointer-events:none;transform-origin:top center;transform-style:preserve-3d;
  animation:flapOpen .5s cubic-bezier(.3,1.3,.55,1) .6s both,gone .3s 1.12s forwards}
.flap i{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:0 0 22px 22px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 9%,var(--paper)),var(--paper) 40%)}
.flap i.fb{transform:rotateX(180deg);border-radius:22px 22px 0 0;background:linear-gradient(0deg,color-mix(in srgb,var(--ink) 10%,var(--paper2)),var(--paper2) 60%);
  box-shadow:0 -10px 20px -14px rgba(var(--shadow),.6)}
@keyframes flapOpen{from{transform:perspective(1500px) rotateX(178deg)}to{transform:perspective(1500px) rotateX(0deg)}}
@keyframes gone{to{opacity:0;visibility:hidden}}
.folder-back,.folder-front{position:absolute;left:-5%;right:-5%;bottom:-7%;pointer-events:none;border-radius:20px;transform-origin:bottom center;animation:folder 1.2s cubic-bezier(.25,.8,.25,1) both}
.folder-back{z-index:1;height:64%;background:color-mix(in srgb,var(--acc2) 80%,#000 12%);border-top-left-radius:8px}
.folder-back::before{content:'';position:absolute;left:0;top:-26px;width:34%;height:32px;border-radius:16px 16px 0 0;background:inherit}
.folder-front{z-index:3;height:46%;display:flex;align-items:flex-end;padding:18px 26px;
  background:linear-gradient(172deg,color-mix(in srgb,var(--acc2) 72%,#fff),var(--acc2));box-shadow:0 -10px 26px -12px rgba(0,0,0,.35)}
.folder-front span{font:600 30px var(--hand);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.15);opacity:.95}
@keyframes folder{
  0%{opacity:0;transform:perspective(1500px) translateY(65vh) rotateX(38deg)}
  32%{opacity:1;transform:perspective(1500px) translateY(0) rotateX(12deg)}
  55%{opacity:1;transform:perspective(1500px) translateY(0) rotateX(12deg)}
  100%{opacity:0;visibility:hidden;transform:perspective(1500px) translateY(70vh) rotateX(-10deg)}}
@keyframes paperOut{
  0%{opacity:0;transform:perspective(1500px) translateY(calc(40% + 65vh)) rotateX(38deg)}
  32%{opacity:1;transform:perspective(1500px) translateY(40%) rotateX(12deg)}
  42%{transform:perspective(1500px) translateY(40%) rotateX(12deg)}
  70%{transform:perspective(1500px) translateY(-5%) rotateX(-6deg)}
  86%,100%{opacity:1;transform:perspective(1500px) translateY(0) rotateX(0)}}
.sheet-layer.closing .scrim{animation:fadeout .4s forwards}
.sheet-layer.closing .paper{animation:paperIn .42s cubic-bezier(.55,0,.75,.2) forwards}
.sheet-layer.closing .folder-back,.sheet-layer.closing .folder-front,.sheet-layer.closing .flap{display:none}
@keyframes fadeout{to{opacity:0}}
@keyframes paperIn{to{opacity:0;transform:perspective(1300px) translateY(22vh) rotateX(55deg) scale(.9)}}
.sh-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;min-height:44px;padding-bottom:14px;border-bottom:1px solid color-mix(in srgb,var(--acc) 25%,transparent)}
.sh-head .kick{font:600 22px var(--hand);color:var(--acc);line-height:1}
.sh-head h2{font-family:var(--head);font-weight:var(--hw);font-size:28px;margin:2px 0 0;letter-spacing:-.02em;line-height:1.1}
.sh-head .x{margin-left:auto;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--paper2);cursor:pointer;display:grid;place-items:center;flex:none}
.sh-foot{display:flex;gap:10px;align-items:center;margin-top:22px;padding-top:16px;border-top:1px dashed var(--line);flex-wrap:wrap}
.bigin{width:100%;border:0;background:none;outline:none;font-family:var(--head);font-weight:var(--hw);font-size:28px;letter-spacing:-.015em;color:var(--ink);padding:6px 0;border-bottom:2px dashed var(--line)}
.bigin:focus{border-bottom-color:var(--acc)}
.bigin::placeholder{color:color-mix(in srgb,var(--muted) 60%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:8px}
.step .chk{width:22px;height:22px;border-radius:7px}
.step input{flex:1;border:0;border-bottom:1px solid var(--line);background:none;outline:none;padding:6px 2px;font:600 14px var(--body)}
.step .rm{border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;padding:0 6px}
.step.dn input{text-decoration:line-through;color:var(--muted)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:12px;border:2px solid transparent;cursor:pointer;transition:transform .15s}
.swatches button:hover{transform:translateY(-2px) rotate(-6deg)}
.swatches button.on{border-color:var(--ink)}
.emojis{display:flex;gap:4px;flex-wrap:wrap}
.emojis button{width:38px;height:38px;border-radius:12px;border:1px solid transparent;background:var(--paper2);font-size:19px;cursor:pointer}
.emojis button.on{border-color:var(--acc);background:var(--soft)}

/* ================= toasts ================= */
#toasts{position:fixed;top:18px;right:18px;z-index:80;display:flex;flex-direction:column;gap:12px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;position:relative;display:flex;align-items:center;gap:12px;max-width:360px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 14px 12px 16px;
  box-shadow:0 24px 40px -20px rgba(var(--shadow),.55);transform-origin:top center;animation:tagDrop .8s cubic-bezier(.3,1.5,.5,1) both}
.toast::before{content:'';position:absolute;top:-18px;left:50%;width:2px;height:18px;background:color-mix(in srgb,var(--ink) 25%,transparent)}
.toast .ti{font-size:22px}
.toast b{display:block;font-size:14px}
.toast span{font-size:13px;color:var(--muted)}
.toast.out{animation:tagOut .35s forwards}
@keyframes tagDrop{0%{opacity:0;transform:perspective(600px) rotateX(-95deg)}100%{opacity:1;transform:none}}
@keyframes tagOut{to{opacity:0;transform:perspective(600px) rotateX(-90deg) translateY(-10px)}}

/* ================= theme page turn ================= */
#turn{position:fixed;inset:0;z-index:100;pointer-events:none;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  background:var(--tbg);color:var(--tink);font-family:var(--thead);font-weight:var(--thw);font-size:34px;box-shadow:inset 40px 0 60px -40px rgba(0,0,0,.25)}
#turn.in{display:flex;transform-origin:left center;animation:turnIn .45s cubic-bezier(.55,0,.4,1) both}
#turn.out{display:flex;transform-origin:right center;animation:turnOut .55s cubic-bezier(.3,0,.2,1) both}
@keyframes turnIn{from{transform:perspective(2200px) rotateY(-100deg)}to{transform:perspective(2200px) rotateY(0)}}
@keyframes turnOut{from{transform:perspective(2200px) rotateY(0)}to{transform:perspective(2200px) rotateY(100deg)}}


/* ================= today: stacks + attention rail ================= */
.colstack{display:flex;flex-direction:column;gap:18px;min-width:0}
.projmini.one{grid-template-columns:1fr;gap:8px}
.todaywrap{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);grid-template-areas:"main";align-items:start}
.todaywrap>.rail{display:none}
.rail-inline .calm{display:none}
.rail-inline .attn{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));column-gap:24px;align-items:start}
.rail-inline .attn-top,.rail-inline .attn>.muted{grid-column:1/-1}
.todaywrap>.grid{grid-area:main}
.rail{grid-area:rail;min-width:0}
.attn{border-color:color-mix(in srgb,var(--hi) 30%,var(--line))}
.attn-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.attn-top b{display:grid;place-items:center;min-width:46px;height:46px;padding:0 8px;border-radius:15px;background:var(--hi);color:#fff;font-family:var(--head);font-weight:var(--hw2);font-size:26px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--hi) 70%,#000),0 12px 18px -10px var(--hi);transform:perspective(300px) rotateX(10deg) rotate(-4deg)}
.attn.calm .attn-top b{background:var(--lo);box-shadow:0 4px 0 color-mix(in srgb,var(--lo) 70%,#000)}
.attn-top span{font-family:var(--head);font-weight:var(--hw);font-size:19px;line-height:1.1}
.fireic{color:var(--hi);animation:flicker 2.4s ease-in-out infinite;display:inline-flex}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(4deg)}}
.usec{margin-top:16px}
.ulist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));padding-top:4px}
.uitem{position:relative;display:flex;align-items:flex-start;gap:10px;padding:14px 12px 12px;border-radius:14px;background:var(--paper2);border:1px solid var(--line);cursor:pointer;
  transform-origin:top center;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;box-shadow:0 8px 14px -12px rgba(var(--shadow),.6)}
.uitem:nth-child(odd){transform:rotate(-.7deg)}
.uitem:nth-child(even){transform:rotate(.6deg)}
.uitem::before{content:'';position:absolute;top:-5px;left:50%;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:var(--hi);z-index:2;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.2),0 3px 4px -1px rgba(0,0,0,.35)}
.uitem.imp::before{background:var(--med)}
.uitem:hover{transform:perspective(700px) rotateX(9deg) translateY(-3px);box-shadow:0 18px 24px -14px rgba(var(--shadow),.6)}
.uitem.late{background:color-mix(in srgb,var(--hi) 9%,var(--paper2));border-color:color-mix(in srgb,var(--hi) 40%,var(--line))}
.uitem .chk{width:22px;height:22px;border-radius:7px;margin-top:1px}
.uitem .tmain{flex:1;min-width:0}
.uitem .ttitle{font-weight:800;font-size:14px;line-height:1.25}
.lateb{display:inline-flex;align-items:center;gap:6px;font:500 11.5px var(--mono);color:var(--hi)}
.lateb i{width:7px;height:7px;border-radius:50%;background:var(--hi);animation:pulse 1.8s infinite}
.lateb.soon{color:var(--med)}.lateb.soon i{background:var(--med)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hi) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (min-width:1560px){
  main.wide{max-width:1780px}
  .todaywrap{grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"main rail"}
  .todaywrap>.rail{display:block}
  .rail-inline{display:none}
  .rail{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;padding:8px 6px 30px;margin:-8px -6px}
  .rail .calm{display:block}
  .ulist{grid-template-columns:1fr}
}

/* ================= focus timer ================= */
.focus{transition:box-shadow .4s}
.focus.running{box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 45%,transparent),var(--sh2)}
.fseg{width:100%;display:flex}
.fseg button{flex:1}
.clockrow{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 14px;perspective:600px}
.fd{position:relative;width:54px;height:76px;perspective:420px;border-radius:12px;box-shadow:0 14px 20px -12px rgba(var(--shadow),.8),0 3px 0 color-mix(in srgb,var(--dark) 70%,#000)}
.fd .h{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--dark);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fd .t{top:0;border-radius:12px 12px 0 0;background:color-mix(in srgb,var(--dark) 88%,var(--dark-ink))}
.fd .b{bottom:0;border-radius:0 0 12px 12px}
.fd .h b{position:absolute;left:0;right:0;height:76px;line-height:76px;text-align:center;font-family:var(--head);font-weight:var(--hw2);font-size:48px;color:var(--dark-ink);font-variant-numeric:tabular-nums}
.fd .t b{top:0}.fd .b b{bottom:0}
.fd::after{content:'';position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:rgba(0,0,0,.35);z-index:6}
.fd .f1{z-index:4;transform-origin:bottom center;animation:fl1 .26s ease-in forwards}
.fd .f2{z-index:5;transform-origin:top center;animation:fl2 .34s .24s cubic-bezier(.3,1.45,.6,1) both}
@keyframes fl1{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@keyframes fl2{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.colon{font-family:var(--head);font-weight:var(--hw2);font-size:42px;color:var(--muted);margin:0 2px;line-height:1}
.running .colon{animation:blink 1s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}
.fprog{height:8px;border-radius:9px;background:var(--paper2);overflow:hidden;border:1px solid var(--line)}
.fprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 60%,var(--paper)),var(--acc));border-radius:9px;transition:width .4s linear}
.ftask{padding:9px 12px;font-size:14px}
.fdots{display:flex;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.fdots i{width:11px;height:11px;border-radius:50%;border:2px solid color-mix(in srgb,var(--acc) 70%,transparent);transition:background .3s}
.fdots i.on{background:var(--acc);border-color:var(--acc)}
.fdots .mono{margin-left:6px;font-size:11px}

/* ================= habits ================= */
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,28px) 30px;gap:8px 6px;align-items:center}
.hgrid .hd{font:500 10px var(--mono);color:var(--muted);text-align:center;text-transform:uppercase}
.hgrid .hd.on{color:var(--acc);font-weight:700}
.hname{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{width:28px;height:28px;border:0;padding:0;background:none;cursor:pointer;perspective:260px;transition:transform .2s}
.hb:not(:disabled):hover{transform:translateY(-2px) scale(1.06)}
.hb .in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.hb.on .in{transform:rotateY(180deg)}
.hb .fr,.hb .bk{position:absolute;inset:0;border-radius:9px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.hb .fr{background:var(--paper2);border:1.5px dashed color-mix(in srgb,var(--muted) 55%,transparent)}
.hb.today .fr{border:2px solid var(--acc)}
.hb .bk{background:var(--acc);color:var(--acc-ink);transform:rotateY(180deg);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.hb:disabled{opacity:.3;cursor:default}
.hstreak{font:500 11px var(--mono);color:var(--muted);text-align:right}
.hstreak.hot{color:var(--acc);font-weight:700}
.hrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hemo{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--paper2);font-size:20px;cursor:pointer;flex:none;transition:transform .2s}
.hemo:hover{transform:rotate(-8deg) scale(1.05)}
body.calm .fireic,body.calm .lateb i{animation:none}
body.calm .uitem:hover{transform:none}
@media (max-width:860px){
  .fd{width:46px;height:66px}.fd .h b{height:66px;line-height:66px;font-size:40px}
  .hgrid{grid-template-columns:repeat(7,minmax(0,1fr)) 30px;gap:6px 6px;justify-items:center}
  .hgrid .hx{display:none}
  .hgrid .hname{grid-column:1/-1;justify-self:stretch;margin-top:6px;white-space:normal}
  .hb{width:26px;height:26px}
}


/* ================= v3: original oonda dashboard style ================= */
.heart{display:inline-block;width:.55em;height:.55em;color:var(--acc);vertical-align:.62em;margin-left:.1em;transition:transform .6s cubic-bezier(.2,1.3,.35,1)}
.heart.sm{width:.8em;height:.8em;vertical-align:-.08em;margin:0}
h1:hover .heart,.brand:hover .heart{transform:rotate(-12deg) scale(1.2)}
.brand .ast{font-size:inherit;vertical-align:baseline;margin:0}
.lab{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
.top.hello h1{font-size:44px;letter-spacing:-.04em;margin-top:4px}
.search{border-radius:99px}
.createbtn{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;background:var(--dark);color:var(--dark-ink);border-radius:99px;padding:6px 18px 6px 6px;font:800 14px var(--body);height:44px;
  box-shadow:0 14px 26px -14px rgba(var(--shadow),.8);transition:transform .15s}
.createbtn span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--dark-ink) 16%,transparent);font-size:18px;line-height:0}
.createbtn:hover{transform:translateY(-2px)}
.createbtn:active{transform:translateY(1px)}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--paper2);border:0;margin-right:10px;font-size:16px;cursor:pointer;color:var(--ink);transition:transform .2s;flex:none}
button.iconbtn:hover{transform:rotate(-10deg) scale(1.06)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{padding:6px 12px;font-size:12.5px}

/* next up dark card */
.nextcard{background:var(--dark);color:var(--dark-ink);border-color:transparent;display:flex;flex-direction:column;min-height:330px;padding-top:24px}
.nextcard .lab{color:color-mix(in srgb,var(--dark-ink) 60%,transparent)}
.nextcard .clip{position:absolute;top:-18px;left:56%;width:30px;transform:rotate(8deg);filter:drop-shadow(0 4px 4px rgba(0,0,0,.25));z-index:3}
.npill{font:800 11.5px var(--body);border-radius:99px;padding:4px 11px;background:color-mix(in srgb,var(--dark-ink) 12%,transparent)}
.npill.hot{background:var(--hi);color:#fff}
.ntitle{font-family:var(--head);font-weight:var(--hw2);font-size:27px;letter-spacing:-.03em;line-height:1.1;margin:14px 0 10px;padding-right:30px;cursor:pointer}
.nextcard .chip.dim{background:color-mix(in srgb,var(--dark-ink) 12%,transparent);color:var(--dark-ink)}
.nstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.nstats div{background:color-mix(in srgb,var(--dark-ink) 7%,transparent);border-radius:14px;padding:10px 12px;min-width:0}
.nstats b{display:block;font-family:var(--head);font-weight:var(--hw);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.ondark{background:transparent;color:var(--dark-ink);border-color:color-mix(in srgb,var(--dark-ink) 25%,transparent);box-shadow:none}

function parseQuick(str) {

  else if ((m = cut(/\s!(low|lo|l)(?=\s)/i))) o.pri = 'low';

/* ---- today: output progress (striped bars) ---- */
function outPeriods() {
  const k = today(), res = [];
  if (V.outRange === 'month') { const [y, m] = k.split('-').map(Number); for (let i = 5; i >= 0; i--) { const d = new Date(y, m - 1 - i, 1); const from = dk(d), to = dk(new Date(d.getFullYear(), d.getMonth() + 1, 0)); res.push({ from, to, label: i ? MON[d.getMonth()] : 'this mo' }); } }
  else { const ws = weekStart(k); for (let i = 5; i >= 0; i--) { const from = addD(ws, -7 * i), to = addD(from, 6); res.push({ from, to, label: i ? `${MON[kd(from).getMonth()]} ${kd(from).getDate()}` : 'this wk' }); } }
  res.forEach(p => { p.tasks = S.tasks.filter(t => t.doneAt && (V.outTab === 'all' || t.list === V.outTab) && dk(new Date(t.doneAt)) >= p.from && dk(new Date(t.doneAt)) <= p.to); p.n = p.tasks.length; });
  return res;
}
function progressCard() {
  const per = outPeriods(), n = per.length, cur = per[n - 1], prev = per[n - 2];
  const pct = prev.n ? Math.round((cur.n - prev.n) / prev.n * 100) : (cur.n ? 100 : 0);
  const withDue = cur.tasks.filter(t => t.due), ot = withDue.filter(t => dk(new Date(t.doneAt)) <= t.due).length, otp = withDue.length ? Math.round(ot / withDue.length * 100) : 100;
  const fm = focusMinsBetween(cur.from, cur.to);
  const mx = Math.max(1, ...per.map(p => p.n)), H = p => Math.round(30 + p.n / mx * 130);
  const word = V.outRange === 'month' ? 'month' : 'week';
  return `<div class="card c7 prog">
    <div class="chips">${[['all', 'everything', '♡'], ...S.lists.map(l => [l.id, l.name, l.emoji])].map(([v, l, e]) => `<button class="chip ${V.outTab === v ? 'on' : ''}" onclick="V.outTab='${v}';render()">${e} ${esc(l)}</button>`).join('')}</div>
    <div class="row" style="margin:14px 0 6px"><h3 style="margin:0"><span class="iconbtn">📈</span>output progress</h3><span class="sp"></span>
      <div class="seg"><button class="${V.outRange !== 'month' ? 'on' : ''}" onclick="V.outRange='week';render()">weekly</button><button class="${V.outRange === 'month' ? 'on' : ''}" onclick="V.outRange='month';render()">monthly</button></div><button class="iconbtn" onclick="go('review')" title="open review">↗</button></div>
    <div class="pgr">
      <div><div><span class="ppct">${pct >= 0 ? '+' : ''}${pct}%</span> <span class="muted" style="font-size:13px">than last ${word}</span></div>
        <div class="bignum">${cur.n}<span>done</span></div>
        <div class="darkpill"><span>⏱ ${otp}% on time</span><span>⏳ ${fm >= 60 ? Math.floor(fm / 60) + 'h ' + (fm % 60) + 'm' : fm + 'm'}</span><button onclick="go('review')" title="review">↗</button></div></div>
      <div class="pchart"><div class="pline" style="bottom:${H(cur) + 26}px;right:${50 / n}%"><b>${pct >= 0 ? '+' : ''}${pct}%</b></div>${per.map((p, i) => `<div class="pcol ${i === n - 1 ? 'cur' : ''}" title="${p.n} done"><span class="pv" style="bottom:${H(p) + 30}px">${p.n}</span><div class="pb ${i === n - 1 ? '' : 'stripe'}" style="height:${H(p)}px;--i:${i}"></div><small>${p.label}</small></div>`).join('')}</div>
    </div></div>`;
}

/* ---- today: schedule timeline (drag to reschedule) ---- */
function schedCard() {
  const t0 = today(), N = 7, W0 = addD(t0, -1), W1 = addD(W0, N - 1), days = Array.from({ length: N }, (_, i) => addD(W0, i));
  const items = S.tasks.filter(t => !isDone(t) && t.due && t.due >= W0 && t.due <= W1).sort((a, b) => a.due < b.due ? -1 : a.due > b.due ? 1 : priRank[a.pri] - priRank[b.pri]);
  const rows = items.slice(0, 5).map(t => {
    const s = diff(t.due, W0), w = 34, l = Math.min(s / N * 100, 100 - w), L = lById(t.list), c = L ? L.color : 'var(--soft)';
    return `<div class="srow"><div class="strack stripe" style="left:${l}%"></div><div class="sbar" style="left:${l}%;width:${w}%;--c:${c}" onpointerdown="schedDrag(event,'${t.id}')" title="${esc(t.title)} — drag to move, click to open">
      <span class="sav">${L ? L.emoji : '📝'}</span><div style="min-width:0"><div class="st">${esc(t.title)}</div><div class="sd">${dueWord(t.due)}${t.time ? ' · ' + timeWord(t.time) : ''}</div></div></div></div>`;
  }).join('');
  const nowPos = Math.min(100, Math.max(0, (Date.now() - kd(W0).getTime()) / (N * DAY) * 100));
  return `<div class="card c5"><div class="row" style="margin-bottom:6px"><h3 style="margin:0"><span class="iconbtn">🗓️</span>schedule</h3><span class="sp"></span>${scrib('drag to reschedule', 'down')}<button class="iconbtn" onclick="go('calendar')" title="open calendar">↗</button></div>
    <div class="sched"><div class="sgrid" style="grid-template-columns:repeat(${N},1fr)">${days.map(() => '<i></i>').join('')}</div><div class="snow" style="left:${nowPos}%"></div>
    <div class="srows" data-n="${N}">${rows || `<div class="empty" style="margin:auto"><span class="hand">nothing this week ${HEARTTXT}</span><div>tasks with a due date show up here</div></div>`}</div>
    <div class="saxis" style="grid-template-columns:repeat(${N},1fr)">${days.map(d => `<span class="${d === t0 ? 't' : ''}">${kd(d).getDate()} ${MON[kd(d).getMonth()]}</span>`).join('')}</div></div>
    ${items.length > 5 ? `<button class="link mt8" onclick="go('calendar')">+ ${items.length - 5} more this week</button>` : ''}</div>`;
}
function schedDrag(e, id) {
  if (e.button !== 0) return;
  const bar = e.currentTarget, wrap = bar.closest('.srows'), W = wrap.getBoundingClientRect().width / (+wrap.dataset.n || 7), x0 = e.clientX; let moved = false;
  bar.setPointerCapture(e.pointerId); bar.classList.add('drag');
  bar.onpointermove = ev => { const dx = ev.clientX - x0; if (Math.abs(dx) > 4) moved = true; bar.style.transform = `translateX(${dx}px) rotate(${Math.max(-2, Math.min(2, dx / 60))}deg)`; };
  bar.onpointerup = ev => {
    bar.onpointermove = bar.onpointerup = null; bar.classList.remove('drag');
    if (!moved) { bar.style.transform = ''; openTask(id); return; }
    const d = Math.round((ev.clientX - x0) / W);
    if (d) { const t = tById(id); t.due = addD(t.due, d); save(); render(); toast('🗓️', `moved ${d > 0 ? '+' : ''}${d} day${Math.abs(d) > 1 ? 's' : ''}`, `“${t.title}” · ${dueWord(t.due)}`); } else render();
  };
}

/* ---- hand-drawn notes with arrows ---- */
function ARROW(dir = 'down', w = 44, h = 30) {

  return `<svg class="arw" width="${w}" height="${h}" viewBox="0 0 60 40" style="transform:${tf}" aria-hidden="true"><path d="M4 6c18 2 34 10 44 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M40 30l8 3 1-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function scrib(text, dir = 'down', before = false) { return `<span class="scrib">${before ? ARROW(dir === 'up' ? 'upleft' : dir) : ''}<span>${text}</span>${before ? '' : ARROW(dir)}</span>`; }

function shuffleNext() {
  const nb = $('#nbody');

  nb.classList.add('flyoff'); setTimeout(() => { V.next++; V.flyin = true; render(); }, 420);
}
function weekStart(k) { let x = k; while (kd(x).getDay() !== S.settings.weekStart) x = addD(x, -1); return x; }
function doneDays() { const s = new Set(); S.tasks.forEach(t => t.doneAt && s.add(dk(new Date(t.doneAt)))); return s; }
function streak() { const s = doneDays(); let k = today(); if (!s.has(k)) k = addD(k, -1); let n = 0; while (s.has(k)) { n++; k = addD(k, -1); } return n; }
function doneThisWeek() { const ws = weekStart(today()); return S.tasks.filter(t => t.doneAt && dk(new Date(t.doneAt)) >= ws).length; }

/* ---------- tasks ---------- */
function matchQ(t) {
  if (!V.q.trim()) return true;
  const q = V.q.toLowerCase(), l = lById(t.list);
  return t.title.toLowerCase().includes(q) || (t.notes || '').toLowerCase().includes(q) || (l && l.name.toLowerCase().includes(q)) || (t.steps || []).some(s => s.t.toLowerCase().includes(q));
}
function tabFilter(tab) {
  const t0 = today();
  return {
    today: t => !isDone(t) && t.due && t.due <= t0 || (isDone(t) && t.doneAt && dk(new Date(t.doneAt)) === t0),
    upcoming: t => !isDone(t) && t.due > t0,

}
VIEWS.tasks = () => {

  const tabs = [['today', 'today'], ['upcoming', 'upcoming'], ['open', 'all open'], ['overdue', 'overdue'], ['done', 'done'], ['all', 'everything']];
  const P = lById(V.proj);
  const head = topbar(P ? `${P.emoji} ${esc(P.name)}` : 'tasks', V.q ? `searching “${esc(V.q)}” <button class="link" onclick="V.q='';render()">clear</button>` : '');
  const ctrl = `<div class="row wrap" style="margin-bottom:14px">${V.mode === 'list' ? `<div class="seg">${tabs.map(([v, l]) => `<button class="${V.tab === v ? 'on' : ''}" onclick="V.tab='${v}';render()">${l}<b>${base.filter(tabFilter(v)).length}</b></button>`).join('')}</div>` : ''}<span class="sp"></span>
    <div class="seg"><button class="${V.mode === 'list' ? 'on' : ''}" onclick="V.mode='list';render()" title="list">${ic('list', 16)}</button><button class="${V.mode === 'board' ? 'on' : ''}" onclick="V.mode='board';render()" title="board">${ic('board', 16)}</button></div>
    <button class="btn dark" onclick="openTask(null,{list:V.proj!=='all'?V.proj:''})">${ic('plus', 16)} new task</button></div>
    <div class="row wrap" style="margin-bottom:18px"><button class="chip ${V.proj === 'all' ? 'on' : ''}" onclick="V.proj='all';render()">everything</button>${S.lists.map(l => `<button class="chip ${V.proj === l.id ? 'on' : ''}" onclick="V.proj='${l.id}';render()">${l.emoji} ${esc(l.name)}</button>`).join('')}<button class="chip" style="border-style:dashed" onclick="openProject()">+ project</button></div>`;
  if (V.mode === 'board') return head + ctrl + `<div class="row" style="margin:-4px 0 12px 6px">${scrib('drag cards between columns', 'down')}</div>` + boardHTML(base);
  const list = base.filter(tabFilter(V.tab)).sort(sortTasks);
  let body;
  if (!list.length) body = emptyHTML(V.q ? 'no matches' : V.tab === 'overdue' ? 'nothing overdue' : 'nothing here', V.q ? '<div>try another word</div>' : '<div>enjoy the quiet ♡</div>');
  else if (V.tab === 'done') body = groupBy(list, t => { const k = dk(new Date(t.doneAt || Date.now())); return dueWord(k) || 'earlier'; });

function groupBy(list, fn) {

      ${s === 'todo' ? `<button class="btn ghost sm" style="width:100%" onclick="openTask(null,{list:V.proj!=='all'?V.proj:''})">+ add</button>` : ''}</div>`;

function bindBoard() {
  let dragId = null;
  $$('.bcard').forEach(c => {
    c.addEventListener('dragstart', e => { dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (_) { } });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
  });

    });
  });
}

VIEWS.calendar = () => {

  }).join('');
  const shift = n => { const d = new Date(y, mo - 1 + n, 1); return dk(d).slice(0, 7); };
  const dayTs = S.tasks.filter(t => t.due === sel).sort(sortTasks);

/* ---------- review ---------- */
VIEWS.review = () => {
  const t0 = today(); let from, to, label;
  if (V.rev === 'week') { from = weekStart(t0); to = addD(from, 6); label = 'this week'; }
  else if (V.rev === 'lastweek') { to = addD(weekStart(t0), -1); from = addD(to, -6); label = 'last week'; }
  else if (V.rev === 'month') { from = t0.slice(0, 8) + '01'; to = dk(new Date(kd(from).getFullYear(), kd(from).getMonth() + 1, 0)); label = 'this month'; }
  else { const f = kd(t0.slice(0, 8) + '01'); f.setMonth(f.getMonth() - 1); from = dk(f); to = dk(new Date(f.getFullYear(), f.getMonth() + 1, 0)); label = 'last month'; }
  const done = S.tasks.filter(t => t.doneAt && dk(new Date(t.doneAt)) >= from && dk(new Date(t.doneAt)) <= to);
  const withDue = done.filter(t => t.due); const onTime = withDue.filter(t => dk(new Date(t.doneAt)) <= t.due).length;
  const days = []; for (let k = from; k <= to; k = addD(k, 1)) days.push(k);
  const per = days.map(k => done.filter(t => dk(new Date(t.doneAt)) === k).length);
  const max = Math.max(1, ...per); const best = per.indexOf(Math.max(...per));
  const dueIn = S.tasks.filter(t => t.due >= from && t.due <= to);
  const rate = dueIn.length ? Math.round(dueIn.filter(isDone).length / dueIn.length * 100) : 0;
  const byP = S.lists.map(l => ({ l, n: done.filter(t => t.list === l.id).length })).filter(x => x.n).sort((a, b) => b.n - a.n);
  const maxP = Math.max(1, ...byP.map(x => x.n));
  const bars = days.map((k, i) => `<div class="b" title="${dueWord(k)}: ${per[i]}"><i class="${per[i] ? '' : 'z'}" style="--h:${per[i] / max * 100}%;--i:${i}"></i><span>${days.length > 10 ? (i % 3 === 0 ? kd(k).getDate() : '') : WD[kd(k).getDay()].slice(0, 2)}</span></div>`).join('');
  return topbar('review', `${label} · ${dueWord(from)} → ${dueWord(to)}`) + `
    <div class="row wrap" style="margin-bottom:18px"><div class="seg">${[['week', 'this week'], ['lastweek', 'last week'], ['month', 'this month'], ['lastmonth', 'last month']].map(([v, l]) => `<button class="${V.rev === v ? 'on' : ''}" onclick="V.rev='${v}';go('review')">${l}</button>`).join('')}</div><span class="sp"></span><button class="btn" onclick="copyReview('${label}','${from}','${to}')">copy summary</button></div>
    <div class="grid">
      <div class="card c3 stat" data-tilt><div class="k">finished</div><div class="v">${done.length}</div><div class="s">tasks checked off</div></div>
      <div class="card c3 stat" data-tilt><div class="k">on time</div><div class="v">${withDue.length ? Math.round(onTime / withDue.length * 100) + '%' : '—'}</div><div class="s">done by their due date</div></div>
      <div class="card c3 stat" data-tilt><div class="k">best day</div><div class="v" style="font-size:${per[best] ? 32 : 40}px">${per[best] ? WDL[kd(days[best]).getDay()] : '—'}</div><div class="s">${per[best] ? per[best] + ' done' : 'no tasks yet'}</div></div>
      <div class="card c3 stat" data-tilt><div class="k">follow-through</div><div class="v">${dueIn.length ? rate + '%' : '—'}</div><div class="s">of tasks due in this range</div></div>
      <div class="card c8"><h3>done per day <span class="mono muted" style="margin-left:auto;font-weight:400">${focusMinsBetween(from, to)} min focused</span></h3><div class="bars">${bars}</div></div>
      <div class="card c4"><h3>by project</h3>${byP.length ? byP.map(({ l, n }) => `<div class="hbar"><span>${l.emoji} ${esc(l.name)}</span><span class="tr"><i style="width:${n / maxP * 100}%;--c:${l.color}"></i></span><span class="mono">${n}</span></div>`).join('') : emptyHTML('nothing yet', '')}</div>
      <div class="card c12"><h3>what you finished</h3>${done.length ? `<div class="tlist">${done.sort((a, b) => b.doneAt - a.doneAt).slice(0, 14).map(rowHTML).join('')}</div>` : emptyHTML('nothing finished in this range', '<div>it’ll fill up as you check things off</div>')}</div>
    </div>`;
};
function copyReview(label, from, to) {
  const done = S.tasks.filter(t => t.doneAt && dk(new Date(t.doneAt)) >= from && dk(new Date(t.doneAt)) <= to);

function copyText(txt, msg) {

function demoOnly(what) { toast('♡', `${what} is in the full version`, 'the demo resets when you refresh'); }
function backup() {
  if (DEMO) return demoOnly('back up');
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `oonda-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('💾', 'backup downloaded', 'keep it somewhere safe');
}
function restore(inp) {
  if (DEMO) { inp.value = ''; return demoOnly('restore'); }
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d.tasks)) throw 0; S = merge(d); save(); go('today'); toast('✨', 'restored', `${S.tasks.length} tasks are back`); } catch (e) { toast('⚠️', 'that file didn’t work', 'pick an oonda backup .json'); } };

}

  if (!S.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const now = AC.currentTime;
    [[660, 0], [990, .09]].forEach(([f, d]) => {
      const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, now + d); g.gain.linearRampToValueAtTime(.12, now + d + .02); g.gain.exponentialRampToValueAtTime(.0001, now + d + .5);

}

let lastShown = -1;

    ${S.habits.map(h => `<span class="hname" title="${esc(h.name)}">${h.emoji} ${esc(h.name)}</span>${days.map(k => { const on = (S.hlog[h.id] || {})[k]; return `<button class="hb ${on ? 'on' : ''} ${k === t0 ? 'today' : ''}" ${k > t0 ? 'disabled' : ''} title="${dueWord(k)}" onclick="toggleHabit('${h.id}','${k}',this)"><span class="in"><span class="fr"></span><span class="bk">${ic('check', 14)}</span></span></button>`; }).join('')}<span class="hstreak ${hStreak(h) >= 3 ? 'hot' : ''}" data-h="${h.id}">${hStreak(h) ? hStreak(h) + 'd' : '–'}</span>`).join('')}
    </div>
    <div class="row mt14" style="font-size:13px"><span class="muted">this week</span><div class="bar-sm sp"><i id="hbar" style="width:${total ? Math.round(done / total * 100) : 0}%"></i></div><span class="mono muted" id="hcount">${done}/${total}</span></div></div>`;
}
function toggleHabit(id, k, btn) {
  S.hlog[id] = S.hlog[id] || {};
  if (S.hlog[id][k]) delete S.hlog[id][k]; else { S.hlog[id][k] = 1; if (k === today()) chime(); }
  save();
  btn.classList.toggle('on', !!S.hlog[id][k]);
  const st = $(`.hstreak[data-h="${id}"]`), h = S.habits.find(x => x.id === id), n = hStreak(h);
  if (st) { st.textContent = n ? n + 'd' : '–'; st.classList.toggle('hot', n >= 3); }
  const t0 = today(), ws = weekStart(t0), days = [0, 1, 2, 3, 4, 5, 6].map(i => addD(ws, i));
  const total = S.habits.length * days.filter(x => x <= t0).length, done = S.habits.reduce((a, hh) => a + days.filter(x => (S.hlog[hh.id] || {})[x]).length, 0);
  if ($('#hbar')) $('#hbar').style.width = (total ? Math.round(done / total * 100) : 0) + '%';
  if ($('#hcount')) $('#hcount').textContent = `${done}/${total}`;
}
let draftH = [];
function openHabits() {
  draftH = S.habits.map(h => ({ ...h }));
  openSheet({
    kick: 'habits', title: 'little daily things', w: 520, label: 'habits',
    body: `<div class="muted" style="font-size:14px">tap the icon to change it. tick them off each day on your today page.</div><div class="hedit mt14" id="hedit"></div><button class="btn ghost sm mt8" onclick="addHabitRow()">+ add a habit</button>`,
    foot: `<span class="sp"></span><button class="btn ghost" onclick="closeSheet()">cancel</button><button class="btn dark" onclick="saveHabits()">save</button>`,
  });
  drawHabits();
  if (!draftH.length) addHabitRow();
}
function drawHabits() {
  const el = $('#hedit'); if (!el) return;
  el.innerHTML = draftH.map((h, i) => `<div class="hrow"><button class="hemo" title="change icon" onclick="draftH[${i}].emoji=HEMOJIS[(HEMOJIS.indexOf(draftH[${i}].emoji)+1)%HEMOJIS.length];drawHabits()">${h.emoji}</button>
    <input class="inp" value="${esc(h.name)}" placeholder="e.g. drink water" oninput="draftH[${i}].name=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();addHabitRow()}"><button class="btn ghost sm" title="remove" onclick="draftH.splice(${i},1);drawHabits()">${ic('x', 14)}</button></div>`).join('');
}
function addHabitRow() { draftH.push({ id: uid(), name: '', emoji: HEMOJIS[draftH.length % HEMOJIS.length] }); drawHabits(); const ins = $$('#hedit input'); ins[ins.length - 1].focus(); }
function saveHabits() {
  S.habits = draftH.filter(h => h.name.trim()).map(h => ({ ...h, name: h.name.trim() }));
  Object.keys(S.hlog).forEach(k => { if (!S.habits.find(h => h.id === k)) delete S.hlog[k]; });
  save(); closeSheet(); render();
}

/* ================= needs attention rail ================= */
function attentionRail() {
  const t0 = today(), t1 = addD(t0, 1), d = new Date(), soonT = `${pad(Math.min(23, d.getHours() + 2))}:${pad(d.getMinutes())}`;
  const open = S.tasks.filter(t => !isDone(t));
  const urgent = open.filter(t => isOver(t) || (t.due && t.due <= t1 && t.pri === 'high') || (t.due === t0 && t.time && t.time <= soonT)).sort(sortTasks);
  const imp = open.filter(t => t.pri === 'high' && !urgent.includes(t)).sort(sortTasks);
  const n = urgent.length + imp.length;
  const item = (t, kind) => {
    const late = isOver(t) ? diff(t0, t.due) : 0;
    const why = late ? `<span class="lateb"><i></i>${late === 1 ? '1 day late' : late + ' days late'}</span>` : t.due === t0 && t.time ? `<span class="lateb soon"><i></i>${timeWord(t.time)} today</span>` : dueBadge(t) || '<span class="pill">no date</span>';
    return `<div class="uitem ${late ? 'late' : ''} ${kind}" data-id="${t.id}" onclick="openTask('${t.id}')"><button class="chk" onclick="event.stopPropagation();tick('${t.id}',this)">${ic('check', 13)}</button>
      <div class="tmain"><div class="ttitle">${esc(t.title)}</div><div class="row wrap" style="gap:8px;margin-top:4px">${why}${chipFor(t)}</div></div></div>`;
  };
  if (!n) return `<aside class="rail"><div class="card attn calm"><div class="attn-top"><b>0</b><span>nothing on fire</span></div>${emptyHTML('all calm ♡', '<div>no overdue or high-priority tasks</div>')}</div></aside>`;
  return `<aside class="rail"><div class="card attn" data-tilt-off>
    <div class="attn-top"><b>${n}</b><span>need${n === 1 ? 's' : ''} your attention</span><span class="sp"></span><span class="fireic">${ic('fire', 22)}</span></div>
    ${urgent.length ? `<div class="usec"><div class="grp-h"><span class="hand" style="color:var(--hi)">urgent</span><span class="mono">${urgent.length}</span></div><div class="ulist">${urgent.slice(0, 6).map(t => item(t, 'urg')).join('')}</div>${urgent.length > 6 ? `<button class="link mt8" onclick="go('tasks',{tab:'overdue'})">+ ${urgent.length - 6} more</button>` : ''}</div>` : ''}
    ${imp.length ? `<div class="usec"><div class="grp-h"><span class="hand" style="color:var(--med)">high priority</span><span class="mono">${imp.length}</span></div><div class="ulist">${imp.slice(0, 6).map(t => item(t, 'imp')).join('')}</div>${imp.length > 6 ? `<button class="link mt8" onclick="go('tasks',{tab:'open'})">+ ${imp.length - 6} more</button>` : ''}</div>` : ''}
    <div class="muted" style="font-size:12.5px;margin-top:14px">urgent = overdue, high priority due by tomorrow, or due in the next 2 hours.</div>
  </div></aside>`;
}

function shopBtn(cls) { return SHOP ? `<a class="${cls}" href="${esc(SHOP)}" target="_blank" rel="noopener" style="text-decoration:none">get the full version ♡</a>` : `<span class="${cls}" style="cursor:default">full version on Etsy ♡</span>`; }
function demoTag() {
  if (!DEMO) return;
  const a = document.createElement(SHOP ? 'a' : 'div'); a.className = 'demotag';
  if (SHOP) { a.href = SHOP; a.target = '_blank'; a.rel = 'noopener'; }
  a.innerHTML = `<i></i><span>demo · nothing is saved</span><b>${SHOP ? 'get oonda ♡' : 'full version on Etsy ♡'}</b>`;
  document.body.appendChild(a); document.title = 'oonda — demo';
}

/* ================= dynamic island ================= */
function islandHTML() {
  const f = S.focus, t0 = today(), d = new Date(), nowT = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (f.running) {
    const L = fLeft(), t = f.taskId ? tById(f.taskId) : null;
    return { cls: 'focus', html: `<i class="dot"></i><span class="it">${f.mode === 'focus' ? 'focus' : FMODES[f.mode]}${t ? ' · ' + esc(t.title) : ''}</span><span class="cd">${pad(Math.floor(L / 60))}:${pad(L % 60)}</span><span class="iact"><button onclick="event.stopPropagation();timerToggle()">pause</button></span>` };
  }
  const nx = S.tasks.filter(t => !isDone(t) && t.due === t0 && t.time && t.time >= nowT).sort(sortTasks)[0];
  const over = S.tasks.filter(isOver).length, left = S.tasks.filter(t => !isDone(t) && (t.due === t0 || isOver(t))).length;
  if (nx) { const mins = Math.round((dueTs(nx) - Date.now()) / 6e4);
    return { cls: mins <= 30 ? 'soon' : '', html: `<i class="dot ${mins > 30 ? 'calm' : ''}"></i><span class="it">next: ${esc(nx.title)}</span><span class="cd">${mins <= 0 ? 'now' : 'in ' + durWord(mins * 6e4)}</span><span class="iact"><button onclick="event.stopPropagation();setDone('${nx.id}',true);render()">done</button><button onclick="event.stopPropagation();later('${nx.id}')">snooze</button></span>` }; }
  if (over) return { cls: '', html: `<i class="dot"></i><span class="it">${over} overdue · ${left} left today</span><span class="cd">${streak()}-day streak</span>` };
  return { cls: '', html: `<i class="dot calm"></i><span class="it">all calm · ${left ? left + ' left today' : 'nothing due today'}</span><span class="cd">${streak()}-day streak</span>` };
}
let islandLast = '';
function updateIsland() {
  const el = $('#island'); if (!el) return;
  const { cls, html } = islandHTML(); const key = cls + html;
  if (key === islandLast) return; islandLast = key;
  el.className = cls; el.innerHTML = html;
}

/* ================= boot ================= */
function boot() {
  $('#brandLogo').innerHTML = logo(36); $('#brandHeart').innerHTML = HEART;
  buildBg(); go('today'); demoTag();
  setInterval(tickClocks, 15000);
  setInterval(checkReminders, 30000); setTimeout(checkReminders, 2500);
  setInterval(timerLoop, 250);
  setInterval(updateIsland, 1000); setTimeout(updateIsland, 1200);
  let lastDay = today(); setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);
  if (!S.welcomed) setTimeout(welcome, 500);
  if (!STORAGE_OK) setTimeout(() => toast('⚠️', 'saving is blocked here', 'your browser is blocking storage — use settings → back up'), 1500);
}
document.addEventListener('DOMContentLoaded', boot);

</script>
